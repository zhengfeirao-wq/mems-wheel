[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tactile500"
version = "0.4.1"
description = "Native Tactile V2 multi-board CH340 PyUSB acquisition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyusb==1.3.1"]

[project.scripts]
tactile500 = "tactile500.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tactile500 = ["assets/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
